# sherwood-agent example config. Copy to config.toml (gitignored) and edit.
# The bundled runner is PAPER ONLY. `mode` must be "paper".

[general]
starting_cash = 1000
mode = "paper"
# state_path = "state.db"   # persist portfolio + fills + audit log to SQLite;
                            # `run` resumes from the last snapshot; `serve` reads it for
                            # /v1/portfolio, /v1/activity, /v1/audit/verify. Omit = no persistence.
# feed_path  = "feeds/demo.csv"  # replay a CSV price feed (timestamp,symbol,price rows).
                            # Omit = the built-in two-symbol demo feed.
decider = "rule"            # "rule" = deterministic thresholds (default).
                            # "ai"   = language model via [ai] below. Advisory only:
                            #          RiskGate still checks every resulting order.

[ai]
# Only read when decider = "ai". The model proposes buy/sell/hold + a fraction;
# anything unparseable, out of range, or timed out degrades to Hold. See
# docs/AI-SAFETY.md.
# base_url          = "https://integrate.api.nvidia.com/v1"  # OpenAI-compatible root, no trailing slash
# model             = "meta/llama-3.1-70b-instruct"
# api_key           = "vault:nvidia"   # a vault reference, never a literal key.
                                       # store it: `sherwood secrets set nvidia`
# temperature       = 0.2
# max_tokens        = 300
# max_calls_per_run = 50               # 0 = unlimited; once hit, every decision is Hold
# request_timeout_secs = 20
# universe          = ["ROAR", "HMNI"] # non-empty = the model may only name these

[risk]
# Every generated order is checked against these before it can be executed.
# Hard stops (kill_switch, max_daily_loss) reject every order. The rest gate
# new entries only — a sell that de-risks is never blocked by them.
max_order_notional    = 100      # cash-asset cap on a single order
max_position_fraction = 0.10     # max share of equity in one asset
max_daily_loss        = 50       # realized-loss circuit breaker (hard stop)
max_unrealized_loss   = 100      # mark-to-market open-loss limit; blocks new buys
max_open_positions    = 10       # refuse a buy that opens an 11th symbol
order_cooldown_secs   = 0        # min seconds between buys of the same symbol (0 = off)
max_slippage          = 0.02     # reject orders asking for more tolerance
allowlist             = []       # non-empty = only these symbols tradable
denylist              = []       # never trade these
kill_switch           = false    # true = reject everything

[copytrade]
# Leader wallet addresses to mirror (lower-cased on load).
leaders               = []
fixed_fraction        = 0.25     # mirror 25% of a leader's traded qty
min_leader_notional   = 25       # ignore leader dust below this
max_mirror_notional   = 100      # hard cap per mirrored order
slippage              = 0.01

[sniper]
enabled               = false
min_initial_liquidity = 5000
entry_notional        = 50

[server]
# `sherwood serve` — the local control-plane HTTP API. Loopback only; a public
# bind needs TLS and is refused.
bind      = "127.0.0.1:8787"
token_ref = "vault:api_token"   # the ADMIN token. Generated into the vault on first
                                # `serve` if absent; read with `sherwood secrets get api_token`.
# operator_token_ref = "vault:api_token_operator"  # optional; may use the hook, not the toggles
# viewer_token_ref   = "vault:api_token_viewer"    # optional; read-only
allow_live         = false      # true = an admin may switch the server to LIVE mode at
                                # runtime (admin token + body re-auth). The bundled runner
                                # is paper-only regardless.
rate_limit_per_min = 120        # global request cap per minute (0 = disabled)
cors_origins       = []         # browser origins allowed to call the API, e.g.
                                # ["http://localhost:5173"] for the dashboard dev server.
                                # Empty = same-origin only.
# static_dir       = "frontend/dist"  # serve the built dashboard at / (run `npm run build`
                                       # in frontend/ first). Omit for API-only + `npm run dev`.
approval_mode        = "auto"          # "auto" = the risk gate decides. "manual" = every
                                       # risk-passing order waits for operator approval in
                                       # the dashboard (or on the API).
approval_timeout_secs = 60             # a pending approval auto-denies after this long

# Per-session hard stops. Any 0 = no limit. Once tripped, every further order is
# denied until POST /v1/session/reset (admin). Reads and cancels are unaffected.
max_session_orders        = 0
max_session_notional      = 0
max_session_duration_secs = 0

[hook]
# The PreToolUse order gate (ADR-0001 Option 3). Only tools listed here may be
# called by the trading agent; each is classified. Empty = deny everything.
# Fill in the exact names from `claude mcp` once the Robinhood MCP is connected.
read_tools   = []   # e.g. ["get_account", "get_positions", "get_quotes"]
place_tools  = []   # e.g. ["place_order"]  — parsed and risk-checked before allow
cancel_tools = []   # e.g. ["cancel_order"] — allowed without a risk check
