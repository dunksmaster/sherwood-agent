[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/events",
    "crates/secrets",
    "crates/execution",
    "crates/copytrade",
    "crates/sniper",
    "crates/decision",
    "crates/chain",
    "crates/signer",
    "crates/wallets",
    "crates/server",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/dunksmaster/sherwood-agent"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"

# Enforced in every crate via `[lints] workspace = true`.
# See docs/ENGINEERING-STANDARDS.md. `missing_docs` and `clippy::pedantic` are
# adopted per crate as documentation catches up, so they do not hard-fail CI
# (which runs `clippy -D warnings`) on a partially-documented codebase.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
