# cargo-deny configuration. See docs/LICENSING.md for the policy this enforces.
# Run locally: `cargo deny check`

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive only. A single copyleft dependency forecloses commercial
# licensing of the whole work (see docs/LICENSING.md). This list is kept
# tight — it holds exactly what the tree uses today plus the handful of
# permissive licences a new Rust dependency almost always carries. Add a
# licence here only when a real dependency needs it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    # webpki-roots (Mozilla CA bundle, pulled in by reqwest/rustls under the
    # `openai` feature). A permissive data licence — no copyleft, no
    # binary-attribution burden. See docs/LICENSING.md.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
exceptions = []
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
