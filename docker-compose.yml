# Run `sherwood serve` in a container.
#
# The server binds 127.0.0.1 only (docs/SECURITY.md), so this uses the host
# network — the dashboard and API are reachable at http://127.0.0.1:8787 on the
# host, and nothing is exposed to the wider network. Linux only; on macOS /
# Windows run the binary directly (see docs/DEPLOYMENT.md).
#
# Set the vault passphrase in your shell (or a gitignored .env file), then:
#
#   docker compose up -d
#
# Put a real config at ./config.toml first (copy config.example.toml). Point its
# `[general] state_path` and `[server] token_ref` vault at /app/data.

services:
  sherwood:
    build: .
    image: sherwood-agent
    network_mode: host
    restart: unless-stopped
    environment:
      # Passed through from the host environment — never written here.
      SHERWOOD_VAULT_PASSPHRASE: ${SHERWOOD_VAULT_PASSPHRASE:?}
      SHERWOOD_VAULT_PATH: /app/data/secrets.vault
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - sherwood-data:/app/data
      - sherwood-logs:/app/logs
      - ./config.toml:/app/config.toml:ro
    command: ["serve", "/app/config.toml"]

volumes:
  sherwood-data:
  sherwood-logs:
